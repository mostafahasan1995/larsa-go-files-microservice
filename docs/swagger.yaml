definitions:
  common.Pagination:
    properties:
      perPage:
        type: integer
      totalCount:
        type: integer
      totalPages:
        type: number
    type: object
  messaging.BatchResponse:
    properties:
      failureCount:
        type: integer
      responses:
        items:
          $ref: '#/definitions/messaging.SendResponse'
        type: array
      successCount:
        type: integer
    type: object
  messaging.SendResponse:
    properties:
      error: {}
      messageID:
        type: string
      success:
        type: boolean
    type: object
  models.Notification:
    properties:
      _id:
        type: string
      content:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      header:
        type: string
      recipient:
        type: string
      service:
        type: string
      status:
        $ref: '#/definitions/types.NotificationStatus'
      topic:
        type: string
      touched:
        type: boolean
      type:
        $ref: '#/definitions/types.NotificationType'
      updatedAt:
        type: string
    type: object
  models.NotificationPagination:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Notification'
        type: array
      pagination:
        $ref: '#/definitions/common.Pagination'
    type: object
  models.NotificationRequest:
    properties:
      _id:
        $ref: '#/definitions/types.Omit'
      content:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      header:
        type: string
      recipient:
        type: string
      service:
        type: string
      status:
        $ref: '#/definitions/types.NotificationStatus'
      topic:
        type: string
      touched:
        type: boolean
      type:
        $ref: '#/definitions/types.NotificationType'
      updatedAt:
        type: string
      userIds:
        items:
          type: string
        type: array
    type: object
  models.TokenRequest:
    properties:
      _id:
        $ref: '#/definitions/types.Omit'
      createdAt:
        type: string
      createdBy:
        type: string
      type:
        $ref: '#/definitions/types.NotificationType'
      updatedAt:
        type: string
      value:
        type: string
    type: object
  mongo.InsertManyResult:
    properties:
      insertedIDs:
        description: The _id values of the inserted documents. Values generated by
          the driver will be of type primitive.ObjectID.
        items: {}
        type: array
    type: object
  service.SendNotificationResult:
    properties:
      batchResponse:
        $ref: '#/definitions/messaging.BatchResponse'
      insertManyResult:
        $ref: '#/definitions/mongo.InsertManyResult'
      topicResponse:
        type: string
    type: object
  types.NotificationStatus:
    enum:
    - read
    - unread
    type: string
    x-enum-varnames:
    - NotificationStatusRead
    - NotificationStatusUnread
  types.NotificationType:
    enum:
    - fcm
    type: string
    x-enum-varnames:
    - NotificationTypeFCM
  types.Omit:
    type: object
info:
  contact: {}
  title: Swagger Go-Notifications API
  version: "1.0"
paths:
  /notification:
    get:
      consumes:
      - application/json
      description: gets paginated notifications.
      parameters:
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      - description: accept-language
        in: header
        name: accept-language
        type: string
      - in: query
        name: getAll
        type: boolean
      - in: query
        name: groupBy
        type: string
      - in: query
        name: lang
        type: string
      - in: query
        name: orderBy
        type: integer
      - in: query
        name: page
        type: string
      - in: query
        name: perPage
        type: string
      - in: query
        name: projection
        type: string
      - in: query
        name: query
        type: string
      - in: query
        name: search
        type: string
      - in: query
        name: sort
        type: string
      - in: query
        name: sortBy
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NotificationPagination'
      summary: get paginated notifications
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: adds and sends a notification to users.
      parameters:
      - description: The notification to send
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/models.NotificationRequest'
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SendNotificationResult'
      summary: add a notification
      tags:
      - notifications
  /notification/{id}:
    delete:
      consumes:
      - application/json
      description: deletes a notification by id.
      parameters:
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
      summary: delete a notification
      tags:
      - notifications
    get:
      consumes:
      - application/json
      description: gets a notification by id.
      parameters:
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      - description: accept-language
        in: header
        name: accept-language
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Notification'
      summary: get a notification
      tags:
      - notifications
  /notification/me:
    get:
      consumes:
      - application/json
      description: gets my paginated notifications.
      parameters:
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      - description: x-service
        in: header
        name: x-service
        required: true
        type: string
      - description: accept-language
        in: header
        name: accept-language
        type: string
      - collectionFormat: csv
        description: accept-language
        in: query
        items:
          type: string
        name: topics
        type: array
      - in: query
        name: getAll
        type: boolean
      - in: query
        name: groupBy
        type: string
      - in: query
        name: lang
        type: string
      - in: query
        name: orderBy
        type: integer
      - in: query
        name: page
        type: string
      - in: query
        name: perPage
        type: string
      - in: query
        name: projection
        type: string
      - in: query
        name: query
        type: string
      - in: query
        name: search
        type: string
      - in: query
        name: sort
        type: string
      - in: query
        name: sortBy
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NotificationPagination'
      summary: get my notifications
      tags:
      - notifications
  /notification/topic:
    post:
      consumes:
      - application/json
      description: adds and sends a notification to topic.
      parameters:
      - description: The notification to send
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/models.Notification'
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SendNotificationResult'
      summary: add a notification with topic
      tags:
      - notifications
  /token:
    post:
      consumes:
      - application/json
      description: adds and sends a token to a user.
      parameters:
      - description: token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/models.TokenRequest'
      - description: x-client
        in: header
        name: x-client
        required: true
        type: string
      - description: x-access-token
        in: header
        name: x-access-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mongo.InsertManyResult'
      summary: add a token
      tags:
      - tokens
swagger: "2.0"
